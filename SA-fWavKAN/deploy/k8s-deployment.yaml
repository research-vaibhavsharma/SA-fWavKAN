apiVersion: apps/v1
kind: Deployment
metadata:
  name: safwavkan-training-worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app: safwavkan
  template:
    metadata:
      labels:
        app: safwavkan
    spec:
      containers:
      - name: safwavkan-container
        image: your-registry/safwavkan:latest
        resources:
          limits:
            nvidia.com/gpu: 1
        command: ["python3", "examples/train_s2s_climate.py"]
